[package]
name = "puzzle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
codex-app-server-client = { git = "https://github.com/openai/codex", rev = "5f49aba876922d6f2f55caa153bbb0ed1b46feba" }
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "5f49aba876922d6f2f55caa153bbb0ed1b46feba" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "5f49aba876922d6f2f55caa153bbb0ed1b46feba" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
