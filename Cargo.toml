[package]
name = "puzzle"
version = "0.1.0"
edition = "2021"

[dependencies]
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "7d47056e", package = "codex-app-server-protocol" }
codex-tui = { git = "https://github.com/openai/codex", rev = "7d47056e", package = "codex-tui", default-features = false }
codex-arg0 = { git = "https://github.com/openai/codex", rev = "7d47056e", package = "codex-arg0" }
codex-config = { git = "https://github.com/openai/codex", rev = "7d47056e", package = "codex-config" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
color-eyre = "0.6"
toml = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
